name: nexchat
description: "NexChat – نيكس شات"
publish_to: 'none'

version: 1.0.18+19

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  signalr_netcore: ^1.4.4
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  image_picker: ^1.2.3
  record: ^7.1.1
  audioplayers: ^6.8.1
  video_player: ^2.14.0
  livekit_client: ^2.13.0
  onesignal_flutter: ^5.7.0
  app_links: ^7.2.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.1.20
  lottie: ^3.6.1
  wakelock_plus: ^1.8.0
  image: ^4.10.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/i18n/
    - assets/lottie/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: assets/images/icon.png
